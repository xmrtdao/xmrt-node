<!DOCTYPE html>
<html>
<head>
  <base href="/xmrt-node/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="XMRT Node — AI-orchestrated Monero mining node">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XMRT Node</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#030303;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
    #loading{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;background:#030303}
    #loading .logo{width:48px;height:48px;background:#ff6600;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#000;margin-bottom:16px;animation:pulse 2s ease-in-out infinite}
    #loading p{color:#666;font-size:14px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  </style>
</head>
<body>
  <div id="loading"><div class="logo">X</div><p>Loading XMRT Node...</p></div>
  <script src="flutter.js" defer></script>
  <script>window.addEventListener('load',function(){_flutter.loader.load({onEntrypointLoaded:function(e){document.getElementById('loading').style.display='none';e.startApp()}})});</script>
</body>
</html>
