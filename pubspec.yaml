name: xmrt_node
description: XMRT-DAO MobileMonero Node — AI-orchestrated Monero mining node
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  flutter_tts: 4.2.2
  file_picker: 8.3.7
  flutter_markdown_plus: ^1.0.7
  shared_preferences: ^2.2.3
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    # XMRT Python agent — extracted to internal storage on first launch
    - agent/xmrt_agent/
    - agent/skills/
    - agent/requirements.txt

  generate: true
