name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Build XMRig native .so
        run: |
          cd android/xmrig
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24
          cmake --build build

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: |
          set -eo pipefail
          # Debug: parse the manifest the way Flutter does
          echo "=== MANIFEST AS FLUTTER SEES IT ==="
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('android/app/src/main/AndroidManifest.xml')
          root = tree.getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          for app in root.findall(f'{ns}application') + root.findall('application'):
              print('  application android:name =', app.get(f'{ns}name'))
              for md in app.findall(f'{ns}meta-data') + app.findall('meta-data'):
                  print('  meta-data android:name =', md.get(f'{ns}name'), ' android:value =', md.get(f'{ns}value'))
          "
          echo "=== END ==="
          flutter build apk --release --target-platform android-arm64 2>&1 | tail -200
          echo "flutter_exit=${PIPESTATUS[0]}"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xmrt-node-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
